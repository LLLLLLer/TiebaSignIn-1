name: Tieba Sign-In Every 60 Days

on:
  schedule:
    - cron: '40 0 * * *'  # 每天 UTC 00:10（北京时间 08:10）
  workflow_dispatch:  # 支持手动触发测试

env:
  START_DATE_UTC: "2025-10-28"  # 2025-10-29 00:00 CST = 2025-10-28 16:00 UTC，但按天算，我们用 UTC 日期 2025-10-28 作为起始日

jobs:
  check-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}  # 需要写权限来提交 .last_run_date

      - name: Get current UTC date
        id: date
        run: echo "today=$(date -u +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: Read last run date
        id: last_run
        run: |
          if [ -f .last_run_date ]; then
            last=$(cat .last_run_date)
            echo "Found last run date: $last"
          else
            last="${{ env.START_DATE_UTC }}"
            echo "No .last_run_date found, using start date: $last"
          fi
          echo "last_run_date=$last" >> $GITHUB_OUTPUT

      - name: Calculate days since last run
        id: calc
        run: |
          last_sec=$(date -d "${{ steps.last_run.outputs.last_run_date }}" +%s)
          today_sec=$(date -d "${{ steps.date.outputs.today }}" +%s)
          diff_days=$(( (today_sec - last_sec) / 86400 ))
          echo "Days since last run: $diff_days"
          echo "days=$diff_days" >> $GITHUB_OUTPUT

      - name: Decide whether to run
        id: should_run
        run: |
          if [ ${{ steps.calc.outputs.days }} -ge 60 ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up JDK 1.8
        if: steps.should_run.outputs.should_run == 'true'
        uses: actions/setup-java@v1
        with:
          java-version: 1.8

      - name: Cache local Maven repository
        if: steps.should_run.outputs.should_run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run Tieba Sign-In
        if: steps.should_run.outputs.should_run == 'true'
        env:
          BDUSS: ${{ secrets.BDUSS }}
          SCKEY: ${{ secrets.SCKEY }}
        run: |
          echo "✅ Executing Tieba sign-in (60-day cycle)..."
          mvn compile exec:java -Dexec.mainClass="top.srcrs.Run" -Dexec.args="${BDUSS} ${SCKEY}"

      - name: Update last run date
        if: steps.should_run.outputs.should_run == 'true'
        run: |
          echo "${{ steps.date.outputs.today }}" > .last_run_date
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .last_run_date
          git commit -m "chore: update last run date for 60-day cycle"
          git push
